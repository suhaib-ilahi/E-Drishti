<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eDrishti System Overview</title>
    <style>
      :root {
        --ink: #f4f0e7;
        --muted: #b8c8c4;
        --green: #5bc6a3;
        --amber: #e8bc58;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 80% 15%, #244a4c 0, transparent 34%),
          linear-gradient(135deg, #10191e, #172b2e 56%, #10171b);
        font:
          14px Georgia,
          serif;
      }
      .scene {
        width: 100%;
        height: 100%;
        padding: 24px;
        position: relative;
      }
      .label {
        color: var(--green);
        font:
          700 10px Arial,
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 400px;
        margin: 12px 0 22px;
        font-size: clamp(24px, 4vw, 42px);
        line-height: 1.02;
        font-weight: 600;
      }
      .signal {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        max-width: 520px;
      }
      .metric {
        padding: 13px;
        border: 1px solid #ffffff24;
        background: #ffffff0d;
      }
      .metric strong {
        display: block;
        color: var(--amber);
        font-size: 24px;
      }
      .metric span {
        color: var(--muted);
        font:
          10px Arial,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pulse {
        position: absolute;
        right: 30px;
        bottom: 24px;
        width: 120px;
        height: 120px;
        border: 1px solid #5bc6a388;
        border-radius: 50%;
        box-shadow:
          0 0 0 18px #5bc6a30f,
          0 0 0 36px #5bc6a306;
      }
      .pulse:after {
        content: "";
        position: absolute;
        inset: 24px;
        border: 1px dashed var(--green);
        border-radius: 50%;
      }
      @media (max-width: 520px) {
        .scene {
          padding: 18px;
        }
        .pulse {
          right: 18px;
          bottom: 18px;
          transform: scale(0.7);
          transform-origin: bottom right;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="label">eDrishti / intelligence layer</div>
      <h1>See the signal behind every public work.</h1>
      <section class="signal" aria-label="Monitoring signals">
        <div class="metric">
          <strong>218K</strong><span>Works monitored</span>
        </div>
        <div class="metric"><strong>36</strong><span>States tracked</span></div>
        <div class="metric">
          <strong>2K</strong><span>Alerts surfaced</span>
        </div>
      </section>
      <div class="pulse" aria-hidden="true"></div>
    </main>
  </body>
</html>
